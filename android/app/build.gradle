apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// react-native-config: pick the env file per build type (lowercase keys). Override with ENVFILE=.env.x
project.ext.envConfigFiles = [
    debug: ".env.development",
    release: ".env.production",
]
apply from: project(":react-native-config").projectDir.getPath() + "/dotenv.gradle"

// Release signing: read from (in order) -P gradle properties / ~/.gradle/gradle.properties, then env vars.
//   FASTLINE_UPLOAD_STORE_FILE, FASTLINE_UPLOAD_STORE_PASSWORD, FASTLINE_UPLOAD_KEY_ALIAS, FASTLINE_UPLOAD_KEY_PASSWORD
// Never commit these values or the keystore. If they are absent, release builds fall back to the debug keystore
// (fine for local smoke tests, NOT uploadable to Play).
def signingProp = { String name ->
    return project.findProperty(name) ?: System.getenv(name)
}
def hasReleaseSigning = signingProp("FASTLINE_UPLOAD_STORE_FILE") != null

// Version: versionName comes from package.json ("version"); versionCode from FASTLINE_VERSION_CODE
// (-P property, ~/.gradle/gradle.properties or env var), default 1. Play requires a strictly increasing
// versionCode for every upload: bump FASTLINE_VERSION_CODE (or change the default below) for each release.
def appVersionName = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def appVersionCode = (signingProp("FASTLINE_VERSION_CODE") ?: "1").toString().toInteger()

// Warn loudly when a release artifact is built without the upload key.
gradle.taskGraph.whenReady { graph ->
    def building = graph.allTasks.any { it.project == project && it.name =~ /^(assemble|bundle|package)Release/ }
    if (building && !hasReleaseSigning) {
        logger.warn("""
**********************************************************************
* FASTLINE: FASTLINE_UPLOAD_* is not set -> the RELEASE build is signed
* with the DEBUG keystore. For local verification ONLY. Google Play and
* App Store submissions need the upload key (see README: Release builds).
**********************************************************************""")
    }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
// Decision: R8/ProGuard is OFF by default. The release path has been build-verified but could not be run
// on a device in the migration environment, and several native libraries (notifee, react-native-iap/Nitro,
// reanimated/worklets, react-native-config) rely on reflection / JNI. To try it, build with
//   -PFASTLINE_MINIFY=true   (or env FASTLINE_MINIFY=true)
// and smoke-test purchases, notifications, the timer and icon switching on a device first. The keep rules in
// proguard-rules.pro cover those libraries. Hermes bytecode is always on (hermesEnabled=true).
def enableProguardInReleaseBuilds = (signingProp("FASTLINE_MINIFY") ?: "false").toString().toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.fastline.app"
    defaultConfig {
        applicationId "com.fastline.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingProp("FASTLINE_UPLOAD_STORE_FILE"))
                storePassword signingProp("FASTLINE_UPLOAD_STORE_PASSWORD")
                keyAlias signingProp("FASTLINE_UPLOAD_KEY_ALIAS")
                keyPassword signingProp("FASTLINE_UPLOAD_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Upload key comes from gradle properties / env (see top of file); debug key otherwise.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    // Android 12+ splash screen API with backport to API 23 (Apache-2.0)
    implementation("androidx.core:core-splashscreen:1.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
