name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Project checks (if defined)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            npm run check
          else
            echo "No 'check' script defined; skipping."
          fi
